# docker compose up -d   →  GradeAI on https://$GRADEAI_DOMAIN with an automatic Let's Encrypt certificate.
services:
  gradeai:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - gradeai-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [gradeai]
    ports:
      - "80:80"
      - "443:443"
    environment:
      GRADEAI_DOMAIN: ${GRADEAI_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gradeai-data:
  caddy-data:
  caddy-config:
