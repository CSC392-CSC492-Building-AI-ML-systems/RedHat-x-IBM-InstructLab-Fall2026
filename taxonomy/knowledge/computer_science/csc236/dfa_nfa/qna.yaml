# Version 2 review draft. Replace all four REPLACE_WITH fields before integration.
version: 3
created_by: "minadd7"
domain: computer_science
document_outline: |
  DFA and NFA transitions, acceptance, state-invariant proofs,
  epsilon-transitions, subset construction, state lower bounds, and
  nonregularity, adapted from David Liu's CSC236 notes with UTM edits by
  Daniel Zingaro. The source is the accompanying Markdown adaptation of the
  uploaded course notes, with original PDF page references recorded
  separately.
seed_examples:
  - context: |
      A deterministic finite automaton is a quintuple $D=(Q,\Sigma,\delta,s,F)$.
      Here $Q$ is a finite set of states, $\Sigma$ is a finite alphabet,
      $\delta:Q\times\Sigma\to Q$ is the transition function, $s\in Q$ is the
      initial state, and $F\subseteq Q$ is the set of accepting states.
      Every state has exactly one transition for each symbol in $\Sigma$.
      The DFA reads a string from left to right, one symbol at a time.

      The notes also use $\delta(q,w)$ for the state reached after reading an
      entire string $w$ from $q$. For every state $q$, $\delta(q,\epsilon)=q$.
      The accepted language is
      $L(D)=\{w\in\Sigma^*\mid\delta(s,w)\in F\}$.
      Thus acceptance is determined by the state reached after the whole input.

      In the notes' binary example, the initial state is $q_0$, the only accepting
      state is $q_1$, and $\delta(q_0,1)=q_1$, $\delta(q_1,1)=q_0$.
    questions_and_answers:
      - question: |
          Why does the DFA definition rule out both a missing transition and two
          different successor states for the same state-symbol pair?
        answer: |
          The function $\delta:Q\times\Sigma\to Q$ must assign exactly one state
          to every pair $(q,a)\in Q\times\Sigma$. A missing transition leaves a
          pair without a value, violating totality. Two different successors for
          the same pair violate the requirement that a function have a unique
          value. These are separate requirements: a DFA must have both a defined
          and a unique successor for each pair.
      - question: |
          Derive a necessary and sufficient condition for a DFA to accept the
          empty string. Does this require every state to be accepting?
        answer: |
          By the extended transition convention, $\delta(s,\epsilon)=s$.
          Therefore $\epsilon\in L(D)$ if and only if $s\in F$. Only the initial
          state must be accepting for the empty string to be accepted; no input
          is read, so the accepting status of other states is irrelevant to this
          particular input.
      - question: |
          A student claims that a DFA accepts as soon as its run visits an
          accepting state. Use the binary example and input 11 to evaluate this
          claim.
        answer: |
          The run starts at $q_0$, moves to the accepting state $q_1$ after the
          first 1, and returns to $q_0$ after the second 1. Since $q_1$ is the
          only accepting state, the complete input 11 is rejected. Acceptance
          depends on the state after the entire input has been read, not on
          whether an accepting state was visited earlier.
  - context: |
      A state invariant for state $q$ characterizes exactly the strings reaching
      it: for every $w\in\Sigma^*$, $\delta(s,w)=q$ if and only if $P_q(w)$ is true. State invariants must
      be mutually exclusive and exhaustive, including the empty string.

      For the binary DFA with initial state $q_0$ and only accepting state $q_1$,
      the transitions are:

      $\delta(q_0, 0) = q_0$
      $\delta(q_0, 1) = q_1$
      $\delta(q_1, 0) = q_1$
      $\delta(q_1, 1) = q_0$

      The invariants say that $q_0$ is reached exactly by strings with an even
      number of 1s, and $q_1$ exactly by strings with an odd number of 1s.
      For the base case, $\epsilon$ has zero 1s and leaves the machine at $q_0$.
      Appending 0 preserves parity; appending 1 reverses it. These facts verify
      every transition and give an induction on string length. Finally, the
      accepting state's invariant is exactly the target condition: an odd number
      of 1s.
    questions_and_answers:
      - question: |
          Under the notes' definition, is proving only
          $\delta(s,w)=q\Rightarrow P_q(w)$ enough to establish a state
          invariant? Explain the missing direction and the roles of mutual
          exclusivity and exhaustiveness.
        answer: |
          No. The notes require $\delta(s,w)=q\Leftrightarrow P_q(w)$ for every
          input string. The forward implication says that strings reaching $q$
          satisfy the predicate; the reverse implication says that every string
          satisfying the predicate reaches $q$. The predicates for distinct
          states must be mutually exclusive because a DFA run ends in a unique
          state, and exhaustive because every string, including $\epsilon$,
          reaches some state. These partition properties alone do not prove that
          the predicates describe the actual transitions.
      - question: |
          Prove that the displayed DFA accepts exactly the binary strings
          containing an odd number of 1s. Give the base case, the transition
          argument, and the connection to acceptance.
        answer: |
          We prove by induction on $|w|$ that the reached state is $q_0$ when
          the number of 1s in $w$ is even and $q_1$ when it is odd. For
          $w=\epsilon$, the count is zero and the machine remains at its initial
          state $q_0$. For the induction step, appending 0 leaves the count
          unchanged and both transitions on 0 preserve the state. Appending 1
          reverses parity and the two entries on 1 interchange $q_0$ and $q_1$.
          Thus the correspondence holds for every string. Every count is either
          even or odd, but not both, so this also gives both directions of each
          state invariant. Since $q_1$ is the only accepting state, the DFA
          accepts if and only if the number of 1s is odd.
      - question: |
          Let $L$ be the target language of strings with an odd number of 1s. A
          proposed proof establishes only that every string in $L$ reaches
          $q_1$. Which language inclusion has it proved, which is still missing,
          and how does the full invariant supply the missing direction?
        answer: |
          Because $q_1$ is accepting, the argument proves $L\subseteq L(D)$. It
          has not proved $L(D)\subseteq L$: the machine might also accept
          strings outside the target language. The full invariant says that
          every string reaching $q_1$ has an odd number of 1s. Since every
          accepted string must end at the sole accepting state $q_1$, this gives
          the missing inclusion and hence $L(D)=L$.
  - context: |
      An NFA without $\epsilon$-transitions is $N=(Q,\Sigma,\delta,s,F)$:
      $Q$ is finite, $\Sigma$ is the alphabet, $s\in Q$ is initial, and
      $F\subseteq Q$ is the set of accepting states.
      Its transition function is $\delta:Q\times\Sigma\to2^Q$, where $2^Q$ is
      the set of all subsets of $Q$. An empty transition set aborts that path.
      In contrast, a DFA transition assigns exactly one state to each state-symbol pair.
      For strings, $\delta(q,w)$ is the set of states reachable after reading all
      of $w$. Acceptance means $\delta(s,w)\cap F\ne\emptyset$: one complete
      accepting path suffices, even if other paths reject or abort.

      The notes' binary NFA has initial state $q_0$, accepting set $\{q_3\}$,
      and the following transitions:

      $\delta(q_0, 0) = \{q_0\}$
      $\delta(q_0, 1) = \{q_0, q_1\}$
      $\delta(q_1, 0) = \{q_2\}$
      $\delta(q_1, 1) = \{q_2\}$
      $\delta(q_2, 0) = \{q_3\}$
      $\delta(q_2, 1) = \{q_3\}$
      $\delta(q_3, 0) = \emptyset$
      $\delta(q_3, 1) = \emptyset$

      It accepts exactly the strings whose third-last symbol is 1: a path may
      loop at $q_0$ through a prefix, leave on that 1, and read exactly two more
      symbols to finish at $q_3$.
    questions_and_answers:
      - question: |
          The transition rules allow two possible successors from $q_0$ on 1 and no successor
          from $q_3$ on 0. Why are both entries valid for this NFA, and why is
          neither an ordinary DFA transition value?
        answer: |
          An NFA transition returns a subset of $Q$. Thus
          $\delta(q_0,1)=\{q_0,q_1\}$ and $\delta(q_3,0)=\emptyset$ are both
          legitimate values in $2^Q$. The first permits two alternative next
          states; the second stops that particular path. A DFA transition must
          instead return one state in $Q$: it cannot branch to two successors or
          leave a state-symbol pair without a successor.
      - question: |
          Using the given transitions, exhibit an accepting path for 0101110. Explain why a
          path that remains at $q_0$ throughout, or a path that enters $q_3$ too
          early, does not invalidate acceptance.
        answer: |
          Loop at $q_0$ while reading the prefix 0101. On the next symbol, 1,
          choose $q_1$; on the remaining 1 move to $q_2$; on the final 0 move to
          $q_3$. This path consumes all seven symbols and ends in the accepting
          state. A path that always stays at $q_0$ ends in a rejecting state. A
          path reaching $q_3$ with input remaining aborts when it tries to read
          the next symbol, because both outgoing transition sets are empty.
          Neither alternative defeats the existence of the complete accepting
          path, so the NFA accepts.
      - question: |
          Prove in both directions that the given NFA accepts
          exactly the binary strings whose third-last symbol is 1. Include the
          case of strings of length less than three.
        answer: |
          If a string is accepted, some complete path ends at $q_3$. The transition rules
          force that path to leave $q_0$ for $q_1$ on a 1 and then consume
          exactly two symbols, moving through $q_2$ to $q_3$. There can be no
          further input on an accepting path, since $q_3$ has no successors.
          Hence the symbol used to leave $q_0$ is third-last and is 1.
          Conversely, if the third-last symbol is 1, loop at $q_0$ through the
          preceding prefix, choose $q_1$ on that 1, and use the final two
          symbols to reach $q_2$ and then $q_3$. This is a complete accepting
          path. A string of length less than three cannot traverse the three
          required symbol-consuming transitions, so it is rejected.
  - context: |
      An $\epsilon$-transition changes state without consuming an input symbol.
      In the notes, the path
      $q_0\xrightarrow{\epsilon}q_1\xrightarrow{0}q_2\xrightarrow{\epsilon}q_3$
      accepts 0, with $q_0$ initial and $q_3$ accepting.

      For a language $L$ over $\Sigma$, the following are equivalent: a regular
      expression matches $L$; a DFA accepts $L$; an NFA, possibly with
      $\epsilon$-transitions, accepts $L$. Thus neither nondeterminism nor
      $\epsilon$-transitions enlarge the class of accepted languages.

      The NFA-to-DFA construction tracks the set of all possible NFA states
      after each input prefix, including states reachable by $\epsilon$-transitions.
      Each such set is represented by one DFA state; an input symbol updates
      this set of possibilities. In the notes' three-state example, there are
      $2^3=8$ subsets before simplification. This counts candidate subsets,
      not the number of states in a minimal equivalent DFA.
      The example has an $\epsilon$-transition from state 1 to state 2, and its
      only accepting NFA state is 1. Any complete set of possibilities containing
      1 must therefore also contain 2. A subset is accepting exactly when it
      contains 1.
    questions_and_answers:
      - question: |
          Why does the displayed path accept the one-symbol string 0 rather than
          a three-symbol input? Identify which transitions consume input.
        answer: |
          Only $q_1\xrightarrow{0}q_2$ consumes a symbol. The transitions from
          $q_0$ to $q_1$ and from $q_2$ to $q_3$ are $\epsilon$-transitions and
          consume nothing. Starting at $q_0$, the path therefore reads exactly 0
          and ends at the accepting state $q_3$. Counting transitions is not the
          same as counting consumed input symbols when $\epsilon$-transitions
          are present.
      - question: |
          Does allowing nondeterministic choices or $\epsilon$-transitions let
          an automaton accept a language that no DFA accepts? Explain what the
          equivalence theorem does and does not imply about state counts.
        answer: |
          No. For each language $L$, existence of an NFA, even one with
          $\epsilon$-transitions, accepting $L$ is equivalent to existence of a
          DFA accepting $L$ and to existence of a regular expression matching
          $L$. The theorem concerns which languages can be represented; it does
          not assert equal state counts. The subset construction represents sets
          of NFA states, and the three-state example has eight candidate subsets
          before simplification. That candidate count is not a claim about the
          minimum size of an equivalent DFA.
      - question: |
          In the three-state example, why is the singleton $\{1\}$ not a
          complete set of possible NFA states after an input prefix? What must
          be added, and why is the resulting subset accepting?
        answer: |
          Whenever state 1 is possible, state 2 is also possible by following
          the $\epsilon$-transition without consuming further input. Thus the
          complete set cannot be $\{1\}$ alone; it must also contain 2. Starting
          with only the possibility 1 gives $\{1,2\}$ after this addition. This
          subset is accepting because it contains the accepting NFA state 1. It
          is not necessary for every state in the subset to be accepting.
  - context: |
      Strings reaching the same DFA state have identical acceptance outcomes
      after every common suffix. Thus $k$ pairwise distinguishable strings
      require at least $k$ states: each pair must have some suffix giving
      different membership in the target language.

      Let $A$ contain the binary strings with at least three 1s. Consider
      $w_i=1^i$ for $0\le i\le3$. If $w_i,w_j$ with $i<j$ reached the same
      state, append $x=1^{3-j}$. Then $w_jx\in A$, but $w_ix\notin A$ because
      $i+3-j<3$. Hence any DFA accepting $A$ needs at least four states.

      For $B=\{0^n1^n\mid n\in\mathbb{N}\}$, where $0\in\mathbb{N}$,
      suppose a DFA with $k$ states accepts $B$. Reading $0^{k+1}$ forces a
      loop: write $0^{k+1}=0^a0^b0^c$, with $a,c\ge0$, $b\ge1$,
      $\delta(s,0^a)=q$, and $\delta(q,0^b)=q$.
      Removing the loop leaves $0^{a+c}$ and $0^{a+b+c}$ at the same state.
      Appending $1^{a+c}$ gives a member of $B$ and a nonmember of $B$,
      contradicting their identical acceptance outcomes. No DFA accepts $B$.
      A language is regular exactly when some DFA accepts it, so $B$ is not
      regular.
    questions_and_answers:
      - question: |
          Use the four strings $w_i=1^i$, $0\le i\le3$, to prove that a DFA
          accepting $A$ needs at least four states. Justify the suffix choice
          for an arbitrary pair.
        answer: |
          Take any $i<j$ and append $x=1^{3-j}$. The string $w_jx$ has exactly
          three 1s and lies in $A$, whereas $w_ix$ has $i+3-j<3$ ones and does
          not. Thus the two prefixes cannot reach the same state in a DFA
          accepting $A$, because a common suffix would then produce the same
          acceptance outcome. This holds for every pair among the four strings,
          so all four must reach distinct states. At least four states are
          necessary. This is a lower bound; it does not by itself construct a
          four-state DFA.
      - question: |
          Why is listing $k$ distinct strings insufficient for a $k$-state lower
          bound? State the needed distinguishability condition, including
          whether one suffix must work for every pair.
        answer: |
          Distinct strings may reach the same state. To force $k$ distinct
          states, every pair of chosen strings must be distinguishable with
          respect to the target language: there must exist a common suffix for
          that pair such that exactly one extended string belongs to the
          language. The suffix may depend on the pair; one universal suffix is
          not required. If any such pair shared a state, its distinguishing
          suffix would contradict the identical future behavior from that state.
      - question: |
          Using the loop argument in the context, prove that
          $B=\{0^n1^n\mid n\in\mathbb{N}\}$ is not regular. Explain why the
          repeated segment must be nonempty and where the contradiction arises.
        answer: |
          Suppose a DFA with $k$ states accepts $B$. The run on $0^{k+1}$ visits
          more state positions than there are states, so two different positions
          share a state. This yields $0^{k+1}=0^a0^b0^c$ with $b\ge1$ and a loop
          on $0^b$. Removing that loop does not change the state reached after
          the entire zero prefix, so $0^{a+c}$ and $0^{a+b+c}$ reach the same
          state. Append the same suffix $1^{a+c}$ to each. The first resulting
          string has equal numbers of zeros and ones and belongs to $B$; the
          second has $b$ extra zeros and does not. The requirement $b\ge1$
          ensures these counts differ. Determinism forces the two extended
          strings to have the same acceptance outcome, a contradiction. Thus no
          DFA accepts $B$, and the stated DFA characterization of regular
          languages implies that $B$ is not regular.
