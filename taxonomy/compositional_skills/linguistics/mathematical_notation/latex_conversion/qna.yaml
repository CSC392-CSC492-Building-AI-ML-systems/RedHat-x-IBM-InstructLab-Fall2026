version: 2
task_description: >-
  Convert mathematical expressions described in natural language into
  equivalent LaTeX notation.
created_by: josh-villas
seed_examples:
  # Level 1: Single equations and inline math
  - question: |
      Express the equation x squared plus y squared equals z squared using LaTeX.
    answer: |
      \[
      x^2 + y^2 = z^2
      \]

  - question: |
      Write the sentence "The function f of x equals the square root of the
      quantity x plus one is defined for x greater than or equal to negative one"
      with the math typeset inline using LaTeX.
    answer: |
      The function $f(x) = \sqrt{x+1}$ is defined for $x \geq -1$.

  # Level 2: Fractions and binomial coefficients
  - question: |
      Express the fraction whose numerator is x squared plus one
      and whose denominator is two x using LaTeX.
    answer: |
      \[
      \frac{x^2+1}{2x}
      \]

  - question: |
      Express the identity n choose k equals n factorial divided by
      k factorial times the factorial of n minus k using LaTeX.
    answer: |
      \[
      \binom{n}{k} = \frac{n!}{k!\,(n-k)!}
      \]

  # Level 3: Sums, integrals and limits
  - question: |
      Express the statement that the sum of the squares of the first n positive
      integers equals n times n plus one times two n plus one, all divided by six,
      using LaTeX.
    answer: |
      \[
      \sum_{k=1}^{n} k^2 = \frac{n(n+1)(2n+1)}{6}
      \]

  - question: |
      Express the sum from i equals one to n of the fraction whose
      numerator is i squared plus one and whose denominator is i plus one.
    answer: |
      \[
      \sum_{i=1}^{n} \frac{i^2+1}{i+1}
      \]

  - question: |
      Express the statement that the integral from zero to one of x squared
      with respect to x equals one third using LaTeX.
    answer: |
      \[
      \int_{0}^{1} x^2 \, dx = \frac{1}{3}
      \]

  - question: |
      Express the statement that the limit as n approaches infinity of the
      quantity one plus one over n, raised to the power n, equals e using LaTeX.
    answer: |
      \[
      \lim_{n \to \infty} \left(1 + \frac{1}{n}\right)^{n} = e
      \]

  # Level 4: Piecewise functions and matrices
  - question: |
      Write the following function in LaTeX: f of x equals x squared
      when x is nonnegative, and negative x when x is negative.
    answer: |
      \[
      f(x) =
      \begin{cases}
      x^2, & x \geq 0,\\
      -x, & x < 0.
      \end{cases}
      \]

  - question: |
      Write in LaTeX: A is the two by two matrix with first row a, b and
      second row c, d, and the determinant of A equals a d minus b c.
    answer: |
      \[
      A = \begin{pmatrix} a & b \\ c & d \end{pmatrix}, \qquad \det(A) = ad - bc
      \]

  # Level 5: Quantifiers, implications and nested inequalities
  - question: |
      Express the following statement in LaTeX:
      For every epsilon greater than zero, there exists a delta
      greater than zero such that, whenever zero is less than the
      absolute value of x minus a and that value is less than delta,
      the absolute value of f of x minus L is less than epsilon.
    answer: |
      \[
      \forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x,\ 0 < |x-a| < \delta \implies |f(x)-L| < \varepsilon.
      \]

  - question: |
      Express the definition of f being in big O of g in LaTeX: there exist a
      real number c greater than zero and a natural number n zero such that for
      every natural number n greater than or equal to n zero, f of n is at most
      c times g of n.
    answer: |
      \[
      \exists c \in \mathbb{R}^{+},\ \exists n_0 \in \mathbb{N},\ \forall n \in \mathbb{N},\
      n \geq n_0 \implies f(n) \leq c \cdot g(n)
      \]
