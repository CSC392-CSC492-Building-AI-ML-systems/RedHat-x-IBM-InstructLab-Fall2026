        full (3): Shows f(n) <= 3n^3 iff 5n^2 + 20 <= 0, which is impossible for every n, so c = 3
          fails for every n_0.
        partial (2): Right reduction, but the "for every n_0" argument is incomplete (for example,
          it checks a few values of n).
        minimal (1): Asserts that c = 3 fails with no argument.
        none (0): Missing, or argues about a value of c - 1 other than 3.
      General rules:
      1. C1 is graded against the correct answer c = 4. C2 and C3 are graded as described above, so
