    question: |
      Student Answer:
      c = 4, n_0 = 5.
      f(n) <= 4n^3 iff n^3 - 5n^2 - 20 >= 0. For n >= 5, n^3 - 5n^2 = n^2(n - 5) >= 0, so the
      inequality holds.
      For c = 3, 3n^3 + 5n^2 + 20 <= 3n^3 means 5n^2 + 20 <= 0, which is impossible for every n,
      so c = 3 fails.
    answer: |
      **Grade:** 6 / 10

      **Feedback:**
      - C1 Constants c and n_0: partial (2/3). c = 4 is right, but n_0 = 5 is invalid: f(5) = 520 > 500 =
        4 * 5^3.
      - C2 Proof that c and n_0 work: minimal (1/4). The step n^2(n - 5) >= 0 drops the - 20, so it does
        not show n^3 - 5n^2 - 20 >= 0; the bound needs n^2(n - 5) >= 20, which holds only from n = 6.
      - C3 Proof that c - 1 fails: full (3/3). Shows 5n^2 + 20 <= 0 is impossible, so c = 3 fails for
        every n_0.
      Total: 2 + 1 + 3 = 6.
