        none (0): No constant, or a constant that does not work.
      - C2 Proof that c and n_0 work: 4 pts.
        full (4): Reduces f(n) <= 4g(n) to n^3 - 5n^2 - 20 >= 0, that is n^2(n - 5) >= 20, and
          proves it for every n >= n_0 (for example, n^2(n - 5) >= 36 * 1 = 36 >= 20 when n >= 6).
        partial (2): Correct reduction, but checks only n = n_0 or asserts that one term "dominates"
          without a bound.
        minimal (1): The argument has an error that breaks it (for example, drops the constant
          term), or it proves a bound only for a constant that is not the smallest.
        none (0): No proof, or the inequality is in the wrong direction.
