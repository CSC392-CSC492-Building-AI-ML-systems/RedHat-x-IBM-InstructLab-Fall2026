    question: |
      Student Answer:
      For n >= 1, 2n^3 + 9n^2 + 4 <= 2n^3 + 9n^3 + 4n^3 = 15n^3. So c = 15 and n_0 = 1.
      c - 1 = 14: 2n^3 + 9n^2 + 4 <= 14n^3 holds for n >= 2, so 14 also works.
    answer: |
      **Grade:** 2 / 10

      **Feedback:**
      - C1 Constants c and n_0: minimal (1/3). c = 15 works with n_0 = 1 but is not the smallest; the
        answer itself shows 14 also works.
      - C2 Proof that c and n_0 work: minimal (1/4). The term-by-term bound is valid, but it proves the
        inequality only for a constant that is not the smallest.
      - C3 Proof that c - 1 fails: none (0/3). The answer argues about 14 instead of showing that 2 fails.
      Total: 1 + 1 + 0 = 2.
