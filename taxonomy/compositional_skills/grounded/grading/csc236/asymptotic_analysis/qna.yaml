    question: |
      Student Answer:
      c = 3, n_0 = 9.
      For n >= 9, n^3 >= 9n^2, so 3n^3 = 2n^3 + n^3 >= 2n^3 + 9n^2 = f(n).
      If c = 2, then 2n^3 + 9n^2 + 4 <= 2n^3 means 9n^2 + 4 <= 0, which is impossible for any
      n, so c = 2 does not work for any n_0.
    answer: |
      **Grade:** 6 / 10

      **Feedback:**
      - C1 Constants c and n_0: partial (2/3). c = 3 is right, but n_0 = 9 is invalid: at n = 9, f(9) =
        2191 > 2187 = 3 * 9^3.
      - C2 Proof that c and n_0 work: minimal (1/4). The step 2n^3 + 9n^2 = f(n) drops the + 4, so the
        argument breaks; it needs n^2(n - 9) >= 4, which holds only from n = 10.
      - C3 Proof that c - 1 fails: full (3/3). Shows 9n^2 + 4 <= 0 is impossible, so c = 2 fails for every
        n_0.
      Total: 2 + 1 + 3 = 6.
