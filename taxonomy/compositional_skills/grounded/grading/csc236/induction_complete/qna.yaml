      Student Answer:
      P(n): F_n >= (3/2)^(n-2).
      Base case: F_2 = 1 = (3/2)^0, so P(2) holds.
      I.H.: Let k >= 2 be arbitrary and assume P(i) for every 1 <= i <= k. We prove P(k+1).
      Since k - 1 >= 1, the hypothesis gives F_k >= (3/2)^(k-2) and F_(k-1) >= (3/2)^(k-3).
      F_(k+1) = F_k + F_(k-1) >= (3/2)^(k-2) + (3/2)^(k-3) = (3/2)^(k-3)(3/2 + 1) = (3/2)^(k-3)(5/2).
      Since 5/2 = 10/4 >= 9/4 = (3/2)^2, F_(k+1) >= (3/2)^(k-1). So P(n) holds for all n >= 1.
    answer: |
      **Grade:** 11 / 13

      **Feedback:**
      - C1 Predicate and base cases: partial (2/3). States P(n), but checks only F_2; the base case F_1 =
        1 >= 2/3 is missing.
      - C2 Complete induction hypothesis: full (3/3). Assumes P(i) for every 1 <= i <= k with k >= 2
        arbitrary, and states the goal.
      - C3 Hypothesis applies to both earlier terms: partial (2/3). Justifies k - 1 >= 1, but never notes
        k + 1 >= 3, so the recurrence applies.
      - C4 Inductive step computation and conclusion: full (4/4). Factors out (3/2)^(k-3), compares 5/2
        with 9/4 and concludes P(n) for all n >= 1.
      Total: 2 + 3 + 2 + 4 = 11.
