    question: |
      Student Answer:
      Let P(n): a_n = (2^(n+1) + (-1)^n) / 3.
      Base cases: a_1 = (4 - 1) / 3 = 1 and a_2 = (8 + 1) / 3 = 3.
      I.H.: Let k >= 2 be arbitrary and suppose P(i) holds for all 1 <= i <= k. We prove P(k+1).
      I.S.: Since k >= 2, k - 1 >= 1, so P(k) and P(k-1) hold. Then
      a_(k+1) = a_k + 2a_(k-1) = (2^(k+1) + (-1)^k) / 3 + (2^(k+1) + 2(-1)^k) / 3
      = (2^(k+2) + 3(-1)^k) / 3, which simplifies to (2^(k+2) + (-1)^(k+1)) / 3.
      Therefore P(n) holds for all n >= 1.
    answer: |
      **Grade:** 10 / 13

      **Feedback:**
      - C1 Predicate and base cases: full (3/3). States P(n) and checks both base cases.
      - C2 Complete induction hypothesis: full (3/3). Assumes P(i) for all 1 <= i <= k with k >= 2
        arbitrary and states the goal.
      - C3 Hypothesis applies to both earlier terms: partial (2/3). Shows k - 1 >= 1 but never notes that
        k+1 >= 3, which is needed for the recurrence to apply.
      - C4 Inductive step computation and conclusion: partial (2/4). 2(-1)^(k-1) equals -2(-1)^k, not
        2(-1)^k, so the sum is (2^(k+2) - (-1)^k) / 3; the claimed simplification from 3(-1)^k is false.
      Total: 3 + 3 + 2 + 2 = 10.
