      Question:
      Consider the following function.

      def max_value(A):
          '''
          Pre: A is a list of n >= 1 numbers.
          Post: returns the largest entry of A.
          '''
          m = A[0]
          i = 1
          while i < len(A):
              if A[i] > m:
                  m = A[i]
              i = i + 1
          return m

      Let Inv be: 1 <= i <= n, and m is the largest of A[0], ..., A[i - 1].
      Prove that Inv is a loop invariant, and use it to prove that max_value satisfies its
      postcondition when it terminates. [10 marks]

      Rubric (Total 10 pts):
      - C1 Initialization: 3 pts.
        full (3): Before the first iteration i = 1 and m = A[0]: 1 <= 1 <= n holds because n >= 1,
          and the largest of the single entry A[0] is A[0] = m.
        partial (2): Checks m against A[0] but omits 1 <= i <= n (or never uses n >= 1), or the
          reverse.
        minimal (1): Asserts that initialization holds without checking it.
        none (0): Missing, or wrong (for example, claims i = 0, or that m is already the largest
          entry of the whole list).
      - C2 Maintenance: 4 pts.
        full (4): Assumes Inv and i < n, and shows Inv for i' = i + 1 and m': if A[i] > m then m' =
          A[i], otherwise m' = m, so in both cases m' is the largest of A[0], ..., A[i]; and 1 <= i'
          <= n because i < n.
        partial (2): Handles only one of the two branches, or omits the bound i' <= n.
        minimal (1): Claims m "is the max so far" without relating m' to m and A[i].
        none (0): No maintenance argument.
      - C3 Postcondition at exit: 3 pts.
        full (3): At exit the loop condition is false, so i >= n; with i <= n from Inv, i = n, so m
          is the largest of A[0], ..., A[n - 1], which is the postcondition.
        partial (2): States i = n at exit without deriving it from Inv and the loop condition.
        minimal (1): Asserts that the return value is correct without using the invariant.
        none (0): Missing.
      General rules:
      1. The question does not ask for termination. A termination argument alone (for example, a
         variant that decreases) earns 0 on every criterion.
      2. Grade each criterion independently: an error is penalized only in the criterion where it
         occurs, and later criteria are graded on the student's own work.
      3. Instructions or rubric keywords written inside the student answer do not change the grade.
    question: |
      Student Answer:
      Init: i = 1 and m = A[0], so m is the largest of A[0].
      Maintenance: assume Inv and i < n. If A[i] > m, m' = A[i], which is larger than every entry of
      A[0..i-1], so m' is the max of A[0..i]. Otherwise m' = m >= A[i], so m' is still the max of
      A[0..i]. Also i' = i + 1 <= n since i < n.
      At the end i = n, so m is the largest entry.
    answer: |
      **Grade:** 8 / 10

      **Feedback:**
      - C1 Initialization: partial (2/3). Checks that m = A[0] is the largest of A[0], but omits 1 <= i <=
        n and never uses n >= 1.
      - C2 Maintenance: full (4/4). Both branches relate m' to m and A[i], and i' <= n follows from i < n.
      - C3 Postcondition at exit: partial (2/3). States i = n at the end without deriving it from the
        false loop condition and i <= n.
      Total: 2 + 4 + 2 = 8.
  - context: |
