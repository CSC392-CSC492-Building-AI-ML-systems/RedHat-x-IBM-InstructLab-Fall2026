    question: |
      Student Answer:
      r = 1*(011*)*0*
      1* handles the leading 1s, each 011* is a 0 followed by at least one 1, and 0* lets the
      string end in 0.
    answer: |
      **Grade:** 7 / 10

      **Feedback:**
      - C1 Soundness (r matches only strings in L): partial (2/4). The final 0* can produce more than one
        0, so r matches 100 and 00; the 00 can only appear in that trailing run.
      - C2 Completeness (r matches every string in L): full (3/3). Every string in L is matched, including
        ε, 0, 01 and 10.
      - C3 Explanation: partial (2/3). Explains how strings in L are produced, but does not notice that 0*
        allows 00 at the end.
      Total: 2 + 3 + 2 = 7.
