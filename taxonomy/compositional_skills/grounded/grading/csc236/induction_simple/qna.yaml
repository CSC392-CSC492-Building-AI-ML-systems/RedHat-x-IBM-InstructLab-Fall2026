    question: |
      Student Answer:
      Assume it works for k.
      (k+1)^3 + 11(k+1) = k^3 + 3k^2 + 3k + 11k + 11 = (k^3 + 11k) + 3k^2 + 3k + 11.
      k^3 + 11k is divisible by 6 and so is the rest, so it is divisible by 6.
    answer: |
      **Grade:** 2 / 10

      **Feedback:**
      - C1 Predicate and base case: none (0/3). There is no base case and no predicate.
      - C2 Induction hypothesis: minimal (1/3). "Assume it works for k" does not state P(k), name a
        witness or declare k arbitrary.
      - C3 Inductive step: minimal (1/4). The expansion drops the +1 from (k+1)^3, so the remainder should
        be 3k^2 + 3k + 12, and the claim that the rest is divisible by 6 is not justified.
      Total: 0 + 1 + 1 = 2.
