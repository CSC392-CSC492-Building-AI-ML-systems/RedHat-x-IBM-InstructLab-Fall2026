    question: |
      Student Answer:
      P(n): 6 | n^3 + 11n.
      Base case: n = 0, 0^3 + 11 * 0 = 0 = 6 * 0.
      I.H.: Let k be an arbitrary natural number and suppose k^3 + 11k = 6m for some integer m.
      We prove P(k+1).
      I.S.: (k+1)^3 + 11(k+1) = (k^3 + 11k) + 3k^2 + 3k + 12 = 6m + 3k^2 + 3k + 12.
      Each of 3k^2, 3k and 12 is a multiple of 3, so 3k^2 + 3k + 12 is divisible by 6.
      Hence (k+1)^3 + 11(k+1) is divisible by 6.
    answer: |
      **Grade:** 8 / 10

      **Feedback:**
      - C1 Predicate and base case: full (3/3). States P(n) and checks n = 0.
      - C2 Induction hypothesis: full (3/3). Assumes P(k) for an arbitrary k with witness m and names the
        goal P(k+1).
      - C3 Inductive step: partial (2/4). The expansion and use of the hypothesis are correct, but being a
        multiple of 3 does not make 3k^2 + 3k divisible by 6; the proof needs k(k+1) to be even.
      Total: 3 + 3 + 2 = 8.
