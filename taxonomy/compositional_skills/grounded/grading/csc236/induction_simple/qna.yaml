    question: |
      Student Answer:
      Base: n = 0 gives 0, which is divisible by 6.
      Assume n^3 + 11n is divisible by 6 for all n.
      Then (n+1)^3 + 11(n+1) = (n^3 + 11n) + 3n^2 + 3n + 12. The first part is divisible by 6
      by assumption. n(n+1) is even, so 3n^2 + 3n = 3n(n+1) is divisible by 6, and 12 is
      divisible by 6, so the sum is divisible by 6.
    answer: |
      **Grade:** 6 / 10

      **Feedback:**
      - C1 Predicate and base case: partial (2/3). The base case n = 0 is checked, but the predicate being
        proved is never stated.
      - C2 Induction hypothesis: none (0/3). Assuming the claim for all n assumes what is being proved, so
        the hypothesis is circular.
      - C3 Inductive step: full (4/4). The expansion is correct, 3n(n+1) is justified as a multiple of 6
        using n(n+1) even, and the sum is shown divisible by 6.
      Total: 2 + 0 + 4 = 6.
