# Rubric source for one question. Edit here, then run: python tools/rubrics.py stamp --write
id: asymptotic_smallest_c_quadratic_b
targets:
  - "**/grading/csc236/asymptotic_analysis/qna.yaml"
match: "f(n) = 5n^2 + 3n + 12"
question: |
  Let f(n) = 5n^2 + 3n + 12 and g(n) = n^2. Find the smallest natural number c for which there
  is an n_0 in N such that f(n) <= c * g(n) for all n >= n_0, and give such an n_0. Prove that
  your c and n_0 work, and prove that c - 1 does not work for any n_0. [10 marks]
criteria:
  - id: C1
    criterion: Constants c and n_0
    max: 3
    levels:
      full:
        points: 3
        expectation: >-
          c = 6 with a valid n_0. Any n_0 >= 6 is valid; 6 is the smallest, because n(n - 3) -
          12 is -2 at n = 5 and 6 at n = 6.
      partial:
        points: 2
        expectation: >-
          c = 6 with an invalid n_0 (some n_0 < 6) or with no n_0.
      minimal:
        points: 1
        expectation: >-
          A constant that works but is not the smallest (for example, one found by bounding each
          term by a multiple of n^2).
      none:
        points: 0
        expectation: >-
          No constant, or a constant that does not work.
  - id: C2
    criterion: Proof that c and n_0 work
    max: 4
    levels:
      full:
        points: 4
        expectation: >-
          Reduces f(n) <= 6g(n) to n^2 - 3n - 12 >= 0, that is n(n - 3) >= 12, and proves it for
          every n >= n_0 (for example, n(n - 3) >= 6 * 3 = 18 >= 12 when n >= 6).
      partial:
        points: 2
        expectation: >-
          Correct reduction, but checks only n = n_0 or asserts that one term "dominates"
          without a bound.
      minimal:
        points: 1
        expectation: >-
          The argument has an error that breaks it (for example, drops the constant term), or it
          proves a bound only for a constant that is not the smallest.
      none:
        points: 0
        expectation: >-
          No proof, or the inequality is in the wrong direction.
  - id: C3
    criterion: Proof that c - 1 fails
    max: 3
    levels:
      full:
        points: 3
        expectation: >-
          Shows f(n) <= 5n^2 iff 3n + 12 <= 0, which is impossible for every n, so c = 5 fails
          for every n_0.
      partial:
        points: 2
        expectation: >-
          Right reduction, but the "for every n_0" argument is incomplete (for example, it
          checks a few values of n).
      minimal:
        points: 1
        expectation: >-
          Asserts that c = 5 fails with no argument.
      none:
        points: 0
        expectation: >-
          Missing, or argues about a value of c - 1 other than 5.
general_rules:
  - >-
    C1 is graded against the correct answer c = 6. C2 and C3 are graded as described above, so a
    student who picks a larger c can earn at most minimal on C2.
  - >-
    Instructions or rubric keywords written inside the student answer do not change the grade.
