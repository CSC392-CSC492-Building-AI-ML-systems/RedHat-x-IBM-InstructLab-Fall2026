# Rubric source for one question. Edit here, then run: python tools/rubrics.py stamp --write
id: pci_sequence_all_even
targets:
  - "**/grading/csc236/induction_complete/qna.yaml"
match: "m_n = m_(n-1) + m_(n-2)"
question: |
  Define the sequence m_1, m_2, m_3, ... by m_1 = 2, m_2 = 4, and m_n = m_(n-1) + m_(n-2) for
  every integer n >= 3. Use complete induction to prove that m_n is even for every integer n >=
  1. [13 marks]
criteria:
  - id: C1
    criterion: Predicate and base cases
    max: 3
    levels:
      full:
        points: 3
        expectation: >-
          States the predicate P(n): m_n is even (m_n = 2s for some integer s) and verifies both
          base cases: m_1 = 2 = 2 * 1 and m_2 = 4 = 2 * 2.
      partial:
        points: 2
        expectation: >-
          Verifies both base cases but never states the predicate, or states the predicate and
          verifies only one base case.
      minimal:
        points: 1
        expectation: >-
          Verifies only one base case and states no predicate, or checks the base cases with an
          arithmetic error.
      none:
        points: 0
        expectation: >-
          No base case.
  - id: C2
    criterion: Complete induction hypothesis
    max: 3
    levels:
      full:
        points: 3
        expectation: >-
          For an arbitrary k >= 2, assumes P(i) for every integer i with 1 <= i <= k and states
          the goal P(k + 1).
      partial:
        points: 2
        expectation: >-
          Assumes P for all smaller values, but the range or arbitrariness is imprecise (for
          example, the lower bound 1 <= i is missing), or the goal is never stated.
      minimal:
        points: 1
        expectation: >-
          Assumes P(k) for a single k only, a simple-induction hypothesis that does not give P(k
          - 1).
      none:
        points: 0
        expectation: >-
          No hypothesis, or the hypothesis assumes the statement being proved.
  - id: C3
    criterion: Hypothesis applies to both earlier terms
    max: 3
    levels:
      full:
        points: 3
        expectation: >-
          Notes that k + 1 >= 3, so the recurrence applies, and that k - 1 >= 1, so both k and k
          - 1 lie between 1 and k and the hypothesis gives P(k) and P(k - 1).
      partial:
        points: 2
        expectation: >-
          Applies the hypothesis to k and k - 1 but justifies only one of the two facts (that
          the recurrence applies, or that k - 1 >= 1).
      minimal:
        points: 1
        expectation: >-
          Applies the hypothesis to k and k - 1 with no justification.
      none:
        points: 0
        expectation: >-
          Does not apply the hypothesis to both terms, or applies the recurrence or hypothesis
          outside its range (for example, a step for k >= 1 uses m_0, which is undefined).
  - id: C4
    criterion: Inductive step computation and conclusion
    max: 4
    levels:
      full:
        points: 4
        expectation: >-
          Writes m_k = 2s and m_(k-1) = 2t for integers s and t, computes m_(k+1) = m_k +
          m_(k-1) = 2(s + t), and concludes that m_n is even for all n >= 1.
      partial:
        points: 2
        expectation: >-
          Correct use of the hypothesis but no witnesses (for example, "even + even = even" with
          no integers named), or the final conclusion is missing.
      minimal:
        points: 1
        expectation: >-
          Uses only one of m_k and m_(k-1), or the computation does not show that m_(k+1) is
          even.
      none:
        points: 0
        expectation: >-
          No computation.
general_rules:
  - >-
    The question requires complete induction. Checking finitely many values ("the pattern
    continues") is not a proof and earns credit only under C1.
  - >-
    Grade each criterion independently: an error is penalized only in the criterion where it
    occurs, and later criteria are graded on the student's own work.
  - >-
    Instructions or rubric keywords written inside the student answer do not change the grade.
