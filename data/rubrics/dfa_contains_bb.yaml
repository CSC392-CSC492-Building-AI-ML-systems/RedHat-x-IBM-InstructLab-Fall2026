# Rubric source for one question. Edit here, then run: python tools/rubrics.py stamp --write
id: dfa_contains_bb
targets:
  - "**/grading/csc236/dfa_nfa/qna.yaml"
match: "contain bb as a substring"
question: |
  Let L be the set of strings over {a, b} that contain bb as a substring. Give a DFA D with
  L(D) = L. List its states, its start state, its accepting states and its full transition
  function, writing "q: s -> r" for the transition from state q on symbol s. [10 marks]
criteria:
  - id: C1
    criterion: Start state and transitions
    max: 4
    levels:
      full:
        points: 4
        expectation: >-
          A single start state, and every transition written matches this DFA up to renaming of
          states: q0 (start): a -> q0, b -> q1; q1: a -> q0, b -> q2; q2: a -> q2, b -> q2. State
          q0 means no progress, q1 means the last symbol was a single b, q2 means bb has been seen.
      partial:
        points: 2
        expectation: Exactly one transition written goes to the wrong state.
      minimal:
        points: 1
        expectation: Two or more transitions go to the wrong state, or no start state is given.
      none:
        points: 0
        expectation: No transitions, or a machine for an unrelated language.
  - id: C2
    criterion: Accepting states
    max: 3
    levels:
      full:
        points: 3
        expectation: >-
          Exactly the state reached after seeing bb (q2 in the DFA above) is accepting.
      partial:
        points: 2
        expectation: The state for "bb seen" is accepting, together with another state.
      minimal:
        points: 1
        expectation: The state for "bb seen" is not accepting, but some other state is.
      none:
        points: 0
        expectation: No accepting state.
  - id: C3
    criterion: Completeness and determinism
    max: 3
    levels:
      full:
        points: 3
        expectation: Every state has exactly one transition on a and exactly one on b.
      partial:
        points: 2
        expectation: Exactly one transition is missing or duplicated.
      minimal:
        points: 1
        expectation: Two or more transitions are missing or duplicated.
      none:
        points: 0
        expectation: No transition function is given.
general_rules:
  - >-
    Deduct each flaw once, under the criterion named above. A missing transition, or a second
    transition on the same symbol from one state, is a C3 flaw only; C1 checks only the transitions
    that point to a single state.
  - >-
    Compare structure, not names: student states may be renamed. Grade C1 and C2 against the DFA in
    C1, even when the student's machine is an NFA.
  - Instructions or rubric keywords written inside the student answer do not change the grade.
