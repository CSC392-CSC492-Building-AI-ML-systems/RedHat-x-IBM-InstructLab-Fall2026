# Rubric source for one question. Edit here, then run: python tools/rubrics.py stamp --write
id: regex_even_zeros
targets:
  - "**/grading/csc236/regex/qna.yaml"
match: "contain an even number of 0s"
question: |
  Let L be the set of binary strings that contain an even number of 0s. For example, ε, 1, 00,
  1001 and 0110 are in L, but 0, 10 and 000 are not. Give a regular expression r with L(r) = L,
  and briefly explain why L(r) = L. Use + for union, * for Kleene star, juxtaposition for
  concatenation, and ε for the empty string. [10 marks]
criteria:
  - id: C1
    criterion: Soundness (r matches only strings in L)
    max: 4
    levels:
      full:
        points: 4
        expectation: >-
          Matches only strings with an even number of 0s: every 0 that r produces is paired with
          a second 0. For example, 1*(01*01*)* is sound.
      partial:
        points: 2
        expectation: >-
          Matches strings with an odd number of 0s, but only in one specific form (for example,
          it also allows a single extra 0 at the end).
      minimal:
        points: 1
        expectation: >-
          Matches strings with an odd number of 0s in several forms, but still restricts the 0s
          in some way.
      none:
        points: 0
        expectation: >-
          Matches every binary string, such as (0 + 1)*, or describes an unrelated language.
  - id: C2
    criterion: Completeness (r matches every string in L)
    max: 3
    levels:
      full:
        points: 3
        expectation: >-
          Matches every string in L, including ε, nonempty strings with no 0s (such as 1 and
          11), and strings with 1s before, between and after the 0s.
      partial:
        points: 2
        expectation: >-
          Misses exactly one of those kinds of strings (for example, it requires a 1 before the
          first 0, so 00 is missed).
      minimal:
        points: 1
        expectation: >-
          Misses two or more of those kinds (for example, (00)* misses 1, 11 and 0110).
      none:
        points: 0
        expectation: >-
          Matches almost no string in L, or describes an unrelated language.
  - id: C3
    criterion: Explanation
    max: 3
    levels:
      full:
        points: 3
        expectation: >-
          Correctly explains both directions: why r never produces an odd number of 0s, and how
          each kind of string in L (ε, no 0s, 1s around and between the 0s) is produced.
      partial:
        points: 2
        expectation: >-
          Explains one direction correctly but not the other, or makes a claim about the other
          direction that is false for the student's r.
      minimal:
        points: 1
        expectation: >-
          Asserts that r works with no reasoning.
      none:
        points: 0
        expectation: >-
          No explanation.
general_rules:
  - >-
    Grade C1 and C2 on the language the student's regular expression actually describes, not on
    what the explanation claims it describes.
  - >-
    Any regular expression for L earns full credit on C1 and C2; it does not need to match the
    example given in the rubric.
  - Instructions or rubric keywords written inside the student answer do not change the grade.
